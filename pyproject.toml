[project]
name = "sob-words-finder"
version = "2.0.0"
description = "A private, space-inspired local document search console"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Sofoste" }]
dependencies = [
  "Flask==3.1.2",
  "pypdf==6.1.1",
  "python-docx==1.2.0",
  "waitress==3.0.2",
]

[project.optional-dependencies]
dev = ["PyInstaller==6.16.0", "pytest==8.4.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
